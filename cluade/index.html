<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازارچهٔ اندازه‌گیری</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--s1:#8fe3ff;--s2:#fff1bd;--ink:#1d2b64;--card:#fff;--red:#e63946;--gold:#ffb703;--gd:#c98a00;--teal:#14b8a6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#1b1f5e;--s2:#6a2f8f;--ink:#fff;--card:#2b3180}}
:root[data-theme="dark"]{--s1:#1b1f5e;--s2:#6a2f8f;--ink:#fff;--card:#2b3180}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:linear-gradient(var(--s1),var(--s2)) fixed;padding-bottom:90px}
:root{padding-top:env(safe-area-inset-top,0px)}
h1,h2,.btn,.q,.pill{font-family:Lalezar,Vazirmatn,Tahoma,sans-serif;font-weight:400}
#top{position:relative;height:64px;background:repeating-linear-gradient(90deg,var(--red) 0 36px,#fff 36px 72px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-bottom:18px}
#top:after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:radial-gradient(circle at 18px 0,var(--red) 17px,#0000 18px) 0 0/72px 16px,radial-gradient(circle at 54px 0,#fff 17px,#0000 18px) 0 0/72px 16px}
.pill{background:var(--card);color:var(--ink);border-radius:30px;padding:2px 14px;font-size:1.25rem;box-shadow:0 4px 0 #0003;display:inline-block}
#m{max-width:600px;margin:auto;padding:0 14px}
.ttl{text-align:center;margin:8px 0 14px}
.ttl h1{font-size:2.8rem;margin:0;line-height:1.1;text-shadow:0 4px 0 #fff8}
.ttl .ic{font-size:4rem;display:inline-block;animation:rk 3s ease-in-out infinite}
@keyframes rk{50%{transform:rotate(-14deg)}}
.ttl p{margin:4px 0;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.lv{background:var(--card);border-radius:24px;border:0;border-bottom:7px solid #0003;padding:14px 8px;text-align:center;font:inherit;color:inherit;cursor:pointer;position:relative}
.lv:nth-child(even){transform:translateY(22px)}
.lv:active{border-bottom-width:3px}
.lv .e{font-size:3rem;display:block}.lv b{font-family:Lalezar;font-weight:400;font-size:1.25rem}
.lv small{display:block;opacity:.8}
.lv.lk{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.btn{background:var(--gold);color:#4a3200;border:0;border-bottom:6px solid var(--gd);border-radius:18px;padding:6px 20px;font-size:1.4rem;cursor:pointer}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn.sm{padding:2px 12px;font-size:1.2rem}.btn.gray{background:#cfd8e3;border-color:#93a1b4}.btn.tl{background:var(--teal);border-color:#0b7d71;color:#fff}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bar h2{margin:0;font-size:1.7rem;flex:1}
.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff9;margin:0 2px;border:2px solid var(--ink)}.dots i.on{background:var(--gold)}
.stage{background:#ffffffb8;border-radius:28px;padding:14px;border-bottom:8px solid #0002;text-align:center}
@media(prefers-color-scheme:dark){.stage{background:#ffffff1f}}
.q{font-size:1.45rem;margin:0 0 6px}
.sv{width:100%;max-height:52vh;display:block;margin:auto}
.chips,.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.wt{width:74px;height:74px;border-radius:50%;padding:0;font-size:1.5rem;line-height:1}.wt small{display:block;font:.7rem Vazirmatn}
.duo{display:flex;gap:12px}.card{flex:1;background:var(--card);color:var(--ink);border:0;border-bottom:7px solid #0003;border-radius:24px;padding:14px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:190px}
.card em{font-style:normal;font-family:Lalezar;font-size:1.3rem;color:var(--red);min-height:1.6em}
.card.win{outline:5px solid var(--teal)}
.opt{min-width:130px}
.shop{display:flex;align-items:center;gap:10px;margin:6px 0}.cust{font-size:4.5rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.bub{background:var(--card);border-radius:20px 20px 20px 4px;padding:10px 14px;font-weight:700;font-size:1.15rem;box-shadow:0 4px 0 #0002;flex:1;text-align:start}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#wv{animation:wv 1.6s linear infinite}@keyframes wv{to{transform:translateX(-45px)}}
#sh{transition:transform 1.1s ease-in-out}
#owl{position:fixed;bottom:0;left:0;right:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;pointer-events:none;z-index:4}
#owl span{font-size:3.2rem;filter:drop-shadow(0 3px 0 #0003)}
#owl b{background:var(--card);padding:8px 14px;border-radius:18px;font-size:1rem;max-width:80%;box-shadow:0 4px 0 #0002}
.res{text-align:center}.res .st{font-size:3.5rem;letter-spacing:6px}.res .fact{background:var(--card);border-radius:18px;padding:10px 14px;margin:10px 0;font-weight:700}
.cert{background:#fffbe8;color:#5a3d00;border:10px double var(--gd);border-radius:12px;padding:22px 14px;text-align:center}
.cert h2{font-size:2.2rem;margin:4px 0}.cert .nm{font-family:Lalezar;font-size:2.6rem;color:var(--red)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
@media print{#top,#owl,.np{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top"><span class="pill">🪙 <span id="co">۰</span></span><span class="pill">⭐ <span id="sr">۰</span></span></div>
<main id="m"></main>
<div id="owl"><span>🦉</span><b>…</b></div>
<canvas id="cf"></canvas>
<script>
const $=s=>document.querySelector(s),fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),R=n=>Math.random()*n|0,sh=a=>a.sort(()=>Math.random()-.5),pk=a=>a[R(a.length)];
let S={st:[0,0,0,0,0,0],c:0};try{S=JSON.parse(localStorage.getItem('sm'))||S}catch(e){}
const sv=()=>{try{localStorage.setItem('sm',JSON.stringify(S))}catch(e){}};
const upd=()=>{$('#co').textContent=fa(S.c);$('#sr').textContent=fa(S.st.reduce((a,b)=>a+b,0))};
const say=t=>{$('#owl b').textContent=t};
let AC;function tn(f,t=0,d=.15,ty='triangle'){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(.12,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const okS=()=>[523,659,784,1047].forEach((f,i)=>tn(f,i*.08)),badS=()=>{tn(220,0,.2,'sawtooth');tn(165,.15,.25,'sawtooth')};
const cv=$('#cf'),cx=cv.getContext('2d');let P=[],run=0;const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();onresize=rs;
function boom(x=innerWidth/2,y=innerHeight/3){for(let i=0;i<70;i++)P.push({x,y,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,r:4+Math.random()*5,c:`hsl(${R(360)},90%,60%)`,l:80,a:0});if(!run){run=1;lp()}}
function lp(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;p.a+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});P.length?requestAnimationFrame(lp):run=0}

let G;
const PR=['آفرین! 🎉','عالی بود!','درست است! ⭐','چه دقیق!','تو استادی!'];
function play(i){G={i,r:0,m:0,n:5};round()}
function round(){if(G.r>=G.n)return fin();$('#m').innerHTML=`<div class="bar"><button class="btn sm gray" onclick="hub()">🏠</button><h2>${LV[G.i].e} ${LV[G.i].n}</h2><div class="dots">${[0,1,2,3,4].map(k=>`<i class="${k<G.r?'on':''}"></i>`).join('')}</div></div><div id="g" class="stage"></div>`;say(LV[G.i].h);LV[G.i].f($('#g'),G.r)}
function win(){okS();boom();S.c+=10;upd();say(pk(PR));setTimeout(()=>{G.r++;round()},1400)}
function lose(t){badS();G.m++;say(t);const g=$('#g');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}
function fin(){const s=G.m<=1?3:G.m<=3?2:1;S.st[G.i]=Math.max(S.st[G.i],s);S.c+=s*5;sv();upd();boom();okS();const l=LV[G.i];
$('#m').innerHTML=`<div class="stage res"><h2 style="font-size:2rem;margin:0">مرحله تمام شد!</h2><div class="st">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><div class="fact">💡 ${l.k}</div>${G.i<5?`<button class="btn tl" onclick="play(${G.i+1})">مرحلهٔ بعد ◀</button> `:`<button class="btn tl" onclick="cert()">🏆 گواهی من</button> `}<button class="btn gray" onclick="play(${G.i})">دوباره</button> <button class="btn gray" onclick="hub()">🏠</button></div>`;say(s==3?'سه ستاره! بی‌نقص بود!':'خوب بود! دوباره هم امتحان کن.')}
function hub(){upd();$('#m').innerHTML=`<div class="ttl"><span class="ic">⚖️</span><h1>بازارچهٔ اندازه‌گیری</h1><p>ماجراهای سیده ساره حسینی در شهر ترازوها</p></div><div class="grid">${LV.map((l,i)=>{const lk=i&&!S.st[i-1];return`<button class="lv ${lk?'lk':''}" ${lk?'':`onclick="play(${i})"`}><span class="e">${lk?'🔒':l.e}</span><b>${l.n}</b><small>${'⭐'.repeat(S.st[i])||l.d}</small></button>`}).join('')}</div><p style="text-align:center;margin-top:44px"><button class="btn tl" onclick="cert()">🏆 گواهی استاد اندازه‌گیری</button></p>`;say('سلام ساره! من جغد دانا هستم. یک مرحله را انتخاب کن تا شروع کنیم!')}
function cert(){const t=S.st.reduce((a,b)=>a+b,0),rk=t>=17?'استاد بزرگ اندازه‌گیری':t>=11?'اندازه‌گیر ماهر':'اندازه‌گیر تازه‌کار';boom();okS();
$('#m').innerHTML=`<div class="cert"><div style="font-size:3rem">🏅⚖️📏🧪🗺️</div><h2>گواهی افتخار</h2><div>این گواهی به</div><div class="nm">سیده ساره حسینی</div><div>پایهٔ سوم دبستان</div><h2 style="color:#0b7d71">${rk}</h2><div>${fa(t)} ستاره از ۱۸ ستاره | ${fa(S.c)} سکه</div></div><p style="text-align:center" class="np"><button class="btn" onclick="print()">🖨️ چاپ</button> <button class="btn gray" onclick="hub()">🏠</button></p>`;say('تبریک! تو یک اندازه‌گیر واقعی هستی!')}

const LV=[
{n:'ترازوی دوکفه‌ای',e:'⚖️',d:'جرم میوه',h:'وزنه‌ها را بگذار تا دو کفه برابر شوند.',k:'وقتی دو کفهٔ ترازو برابر شوند، جرم‌ها برابرند. ترازو را روی سطح صاف بگذار.',
f(g,r){const F=[['🍎',300],['🍊',250],['🍌',150],['🍇',450],['🍉',900]][r],L=F[1];let ws=[],a=0,v=0,od=0,dn=0;const C={500:'#e63946',200:'#7b2cbf',100:'#2a9d8f',50:'#f77f00'};
g.innerHTML=`<p class="q">جرم میوه را پیدا کن! ترازو باید صاف شود.</p><svg viewBox="0 0 400 290" class="sv"><defs><linearGradient id="wd" x1="0" x2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#e09f3e"/></linearGradient></defs><path d="M200 90V250M140 266H260L240 244H160Z" stroke="#8d5524" stroke-width="10" fill="#a9722e" stroke-linejoin="round"/><g id="bm"><rect x="70" y="84" width="260" height="12" rx="6" fill="url(#wd)"/></g><circle cx="200" cy="90" r="12" fill="#e63946"/><g id="pl"></g><g id="pr"></g></svg><div class="chips">${[500,200,100,50].map(w=>`<button class="btn wt" data-w="${w}" style="background:${C[w]};border-color:#0004;color:#fff">${fa(w)}<small>گرم</small></button>`).join('')}<button class="btn sm gray" id="un">↩️</button></div><div class="pill" id="tot">وزنه‌ها: ۰ گرم</div>`;
const bm=g.querySelector('#bm'),pl=g.querySelector('#pl'),pr=g.querySelector('#pr'),rp='<path d="M0 0L-48 56M0 0L48 56" stroke="#6b4f2a" stroke-width="2"/><path d="M-58 56H58Q52 82 0 84Q-52 82 -58 56Z" fill="#14b8a6" stroke="#0b7d71" stroke-width="3"/>';
pl.innerHTML=rp+`<text y="52" font-size="46" text-anchor="middle">${F[0]}</text>`;
const sum=()=>ws.reduce((x,y)=>x+y,0),dr=()=>{pr.innerHTML=rp+ws.map((w,i)=>{const x=-42+(i%4)*28,y=50-(i/4|0)*22;return`<rect x="${x-13}" y="${y-18}" width="26" height="20" rx="5" fill="${C[w]}"/><text x="${x}" y="${y-4}" font-size="11" fill="#fff" text-anchor="middle">${fa(w)}</text>`}).join('');g.querySelector('#tot').textContent=`وزنه‌ها: ${fa(sum())} گرم`};dr();
g.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(dn)return;tn(400+ws.length*40,0,.1);ws.push(+b.dataset.w);dr();if(sum()==L){dn=1;win()}else if(sum()>L&&!od){od=1;lose('وزنه‌ها سنگین‌تر شدند! با ↩️ یکی را بردار.')}});
g.querySelector('#un').onclick=()=>{if(!dn){ws.pop();dr()}};
(function t(){if(!bm.isConnected)return;const tg=Math.max(-22,Math.min(22,(L-sum())/12));v+=(tg-a)*.06;v*=.9;a+=v;const q=a*Math.PI/180,c=130*Math.cos(q),s=130*Math.sin(q);bm.setAttribute('transform',`rotate(${-a} 200 90)`);pl.setAttribute('transform',`translate(${200-c} ${90+s})`);pr.setAttribute('transform',`translate(${200+c} ${90-s})`);requestAnimationFrame(t)})()}},

{n:'کدام سنگین‌تر؟',e:'🏋️',d:'تخمین',h:'اندازهٔ بزرگ همیشه جرم زیاد نیست! حدس بزن.',k:'جرم یک جسم روی ماه عوض نمی‌شود، اما وزنش کمتر می‌شود چون گرانش ماه کمتر است. 🌙',
f(g,r){const P=[[['🎈','بادکنک بزرگ',3],['🔑','کلید کوچک',20]],[['🧸','عروسک پشمی',250],['🔨','چکش کوچک',800]],[['🪶','پر بزرگ',1],['🪙','سکهٔ کوچک',7]],[['🏐','توپ والیبال',270],['🪨','سنگ کوچک',400]],[['🧺','سبد حصیری',200],['🥫','قوطی کنسرو',420]]][r],hv=P[0][2]>P[1][2]?0:1;let dn=0;
g.innerHTML=`<p class="q">کدام سنگین‌تر است؟ اول حدس بزن!</p><div class="duo">${sh([0,1]).map(k=>`<button class="card" data-k="${k}"><span style="font-size:${k?'3.4rem':'6rem'}">${P[k][0]}</span><b>${P[k][1]}</b><em></em></button>`).join('')}</div>`;
g.querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(dn)return;dn=1;g.querySelectorAll('.card').forEach(c=>{const k=+c.dataset.k;c.querySelector('em').textContent=fa(P[k][2])+' گرم';if(k==hv)c.classList.add('win')});if(+b.dataset.k==hv)win();else{lose('اندازهٔ بزرگ همیشه یعنی سنگین نیست؛ جنس هم مهم است!');setTimeout(()=>{G.r++;round()},2600)}})}},

{n:'خط‌کش جادویی',e:'📏',d:'طول',h:'مداد از صفر شروع نشده؟ عدد انتها منهای عدد ابتدا!',k:'خط‌کش را از صفر شروع کن. اگر جسم از صفر شروع نشد: عدد انتها منهای عدد ابتدا.',
f(g,r){const s=[0,2,3,4,5][r],l=3+R(7),e=s+l,u=28,x0=20,X=x0+s*u,E=x0+e*u;let tk='',lb='';for(let i=0;i<=150;i++){const x=x0+i*u/10;tk+=`M${x} 104v${i%10?i%5?8:13:20}`;if(i%10==0)lb+=`<text x="${x}" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d00">${fa(i/10)}</text>`}
const o=[l];[e,s?s:l+1,l+1,l-1,l+2].forEach(x=>{if(x>0&&!o.includes(x)&&o.length<3)o.push(x)});
g.innerHTML=`<p class="q">طول مداد چند سانتی‌متر است؟</p><svg viewBox="0 0 440 160" class="sv"><rect x="8" y="100" width="424" height="52" rx="8" fill="#ffe29a" stroke="#c98a00" stroke-width="3"/><path d="${tk}" stroke="#5a3d00" stroke-width="1.5"/>${lb}<rect x="${X}" y="40" width="${l*u-24}" height="28" fill="#ffb703"/><rect x="${X}" y="40" width="12" height="28" fill="#ff8fa3"/><path d="M${E-24} 40L${E} 54L${E-24} 68Z" fill="#f4c995"/><path d="M${E-8} 49L${E} 54L${E-8} 59Z" fill="#333"/><path d="M${X} 68V100M${E} 54V100" stroke="#e63946" stroke-width="2" stroke-dasharray="4 3"/></svg><div class="opts">${sh(o).map(v=>`<button class="btn opt" data-v="${v}">${fa(v)} سانتی‌متر</button>`).join('')}</div>`;
g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.v==l)win();else lose(s?'ابتدای مداد روی صفر نیست! عدد انتها منهای عدد ابتدا.':'از صفر تا نوک مداد را دوباره بشمار.')})}},

{n:'پیمانهٔ آب',e:'🧪',d:'گنجایش',h:'دکمهٔ آبی را نگه دار تا آب بریزد.',k:'هنگام خواندن پیمانه، چشمت را هم‌سطح آب نگه دار؛ نگاه کج باعث خطا می‌شود.',
f(g,r){const T=[250,500,750,100,1000][r];let ml=0,h=0,dn=0,tk='';for(let k=1;k<=20;k++){const y=305-k*13,L=k%5==0;tk+=`<path d="M215 ${y}h${L?-30:k%2?-8:-16}" stroke="#4b6a85" stroke-width="3"/>${L?`<text x="226" y="${y+5}" font-size="14" font-weight="700" fill="currentColor">${fa(k*50)}</text>`:''}`}
g.innerHTML=`<p class="q">${fa(T)} میلی‌لیتر آب بریز${T==1000?' (یک لیتر!)':''}</p><svg viewBox="0 0 310 330" class="sv"><defs><clipPath id="cp"><path d="M85 40V290Q85 305 100 305H200Q215 305 215 290V40Z"/></clipPath><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ad1ff"/><stop offset="1" stop-color="#1478d4"/></linearGradient></defs><rect id="st" x="146" y="36" width="8" height="0" fill="#5ad1ff"/><g clip-path="url(#cp)"><rect id="wr" x="60" width="180" height="300" fill="url(#wg)"/><path id="wv" fill="#9be7ff" opacity=".8"/></g><path d="M85 40V290Q85 305 100 305H200Q215 305 215 290V40" fill="none" stroke="#8fb3c9" stroke-width="6" stroke-linecap="round"/>${tk}<text x="150" y="30" font-size="30" text-anchor="middle">🚰</text></svg><div class="pill" id="rd"></div><div class="chips"><button class="btn tl" id="pu">🚰 بریز</button><button class="btn gray" id="dr">🔽 خالی کن</button><button class="btn" id="ck">✅ بررسی</button></div>`;
const wr=g.querySelector('#wr'),wv=g.querySelector('#wv'),st=g.querySelector('#st'),rd=g.querySelector('#rd');
const hd=(b,d)=>{b.onpointerdown=e=>{e.preventDefault();h=d};['onpointerup','onpointerleave','onpointercancel'].forEach(p=>b[p]=()=>h=0)};hd(g.querySelector('#pu'),1);hd(g.querySelector('#dr'),-1);
g.querySelector('#ck').onclick=()=>{if(dn)return;if(Math.abs(ml-T)<=30){dn=1;h=0;win()}else lose(ml<T?'کمی کم است! بیشتر بریز.':'کمی زیاد است! خالی کن.')};

{n:'فروشگاه گرم و کیلو',e:'🛒',d:'تبدیل واحد',h:'یادت باشد: ۱ کیلوگرم = ۱۰۰۰ گرم و ۱ لیتر = ۱۰۰۰ میلی‌لیتر.',k:'۱ کیلوگرم = ۱۰۰۰ گرم و ۱ لیتر = ۱۰۰۰ میلی‌لیتر. ابزار را با چیزی که می‌سنجیم انتخاب کن.',
f(g,r){const k=1+R(4),Tl=[['ترازو','⚖️'],['خط‌کش','📏'],['پیمانه','🧪'],['ساعت','⏰'],['دماسنج','🌡️']],TQ=[['جرم یک سیب را با چه ابزاری می‌سنجیم؟',0],['طول مداد را با چه ابزاری می‌سنجیم؟',1],['مقدار آب بطری را با چه ابزاری می‌سنجیم؟',2],['زمان را با چه ابزاری می‌سنجیم؟',3],['دمای هوا را با چه ابزاری می‌سنجیم؟',4]];

else{const t=pk(TQ);q=t[0];a=Tl[t[1]][1]+' '+Tl[t[1]][0];o=[a,...sh(Tl.filter((_,i)=>i!=t[1])).slice(0,2).map(x=>x[1]+' '+x[0])]}

f(g,r){const sc=r<3?1:2,d=2+R(6),y0=R(6),x1=R(10-d),x2=x1+d,fl=R(2),sx=fl?x2:x1,tx=fl?x1:x2,c=x=>20+x*40+20,cy=20+y0*40+20;let gr='';for(let i=0;i<=10;i++)gr+=`M${20+i*40} 20v240`;for(let j=0;j<=6;j++)gr+=`M20 ${20+j*40}h400`;
